name: 神仙连开奖填入
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lottery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 执行开奖填入脚本
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/lottery.py
