name: 神仙连开奖填入
on:
  schedule:
    # 每天22:00 (UTC+8) = UTC 14:00
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  lottery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 执行开奖填入脚本
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python scripts/lottery.py
      - name: 同步数据到仓库
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ce3470b6f88383f2a26791eb2c55e2e4
        run: |
          python3 -c "
          import json, urllib.request, os
          req = urllib.request.Request(
              f'https://api.github.com/gists/{os.environ[\"GIST_ID\"]}',
              headers={'Authorization': f'token {os.environ[\"GIST_TOKEN\"]}'}
          )
          resp = urllib.request.urlopen(req)
          data = json.loads(resp.read())
          content = data['files']['sxl_data.json']['content']
          os.makedirs('data', exist_ok=True)
          with open('data/sxl_data.json', 'w') as f:
              f.write(content)
          print('Synced data/sxl_data.json from Gist')
          "
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sxl_data.json
          git diff --cached --quiet || git commit -m "auto: sync data from Gist [lottery]"
          git push
